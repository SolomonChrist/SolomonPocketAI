name: Public source checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==2.4.6 Pillow==11.1.0 pypdf==6.1.1 sounddevice==0.5.5
      - name: Compile Python sources
        run: python -m py_compile SolomonPocketAI.py solomon_pocket_tools.py scripts/download_models.py
      - name: Run capability tests
        run: python -m unittest discover -s python_tests -v
      - name: Check public repository surface
        shell: powershell
        run: .\scripts\check-public-repo.ps1
